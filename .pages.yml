media:
  input: assets
  output: assets
content:
- name: profile
  label: Home
  type: file
  path: content/profile.json
  format: json
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: short_affiliation
    label: Header affiliation
    type: string
  - name: research_fields
    label: Research fields
    type: string
  - name: headline
    label: Headline
    type: text
    description: Use a new line to insert a line break.
  - name: role
    label: Role
    type: string
    required: false
  - name: affiliation
    label: Affiliation
    type: string
    required: false
  - name: lab
    label: Lab
    type: string
    required: false
  - name: intro
    label: Introduction
    type: text
    required: false
  - name: email
    label: Email
    type: string
    required: false
  - name: scholar
    label: Google Scholar URL
    type: string
    required: false
  - name: github
    label: GitHub URL
    type: string
    required: false
  - name: cv
    label: CV PDF
    type: file
    required: false
  - name: title_suffix
    label: Browser tab subtitle
    type: string
    description: Shown after your name in the browser tab.
- name: research
  label: Research highlights
  type: file
  path: content/research.json
  format: json
  fields:
  - name: title
    label: Section title
    type: string
  - name: subtitle
    label: Section subtitle
    type: string
    description: Optional. Leave empty to hide the subtitle.
  - name: items
    label: Research items
    type: object
    list: true
    fields:
    - name: tag
      label: Tag
      type: string
      required: false
    - name: title
      label: Title
      type: string
      required: true
    - name: summary
      label: Summary
      type: text
      required: false
    - name: status
      label: Status
      type: string
      required: false
      description: 'For example: Published · Combustion and Flame, or Work in progress.'
    - name: link
      label: Link
      type: string
      required: false
    - name: image
      label: Image
      type: image
      required: true
    - name: caption
      label: Caption
      type: text
      required: false
    - name: alt
      label: Alt text (accessibility)
      type: text
      required: true
- name: publications
  label: Publications
  type: file
  path: content/publications.json
  format: json
  fields:
  - name: title
    label: Section title
    type: string
  - name: subtitle
    label: Section subtitle
    type: string
    description: Optional. Leave empty to hide the subtitle.
  - name: items
    label: Publication items
    type: object
    list: true
    fields:
    - name: title
      label: Title
      type: string
      required: true
    - name: authors
      label: Authors
      type: text
      required: false
    - name: journal
      label: Journal
      type: string
      required: false
    - name: volume
      label: Volume
      type: string
      required: false
    - name: article
      label: Article
      type: string
      required: false
    - name: year
      label: Year
      type: number
      required: true
    - name: doi
      label: Doi
      type: string
      required: false
    - name: note
      label: Note
      type: string
      required: false
    - name: pdf
      label: Pdf
      type: file
      required: false
- name: conferences
  label: Conferences
  type: file
  path: content/conferences.json
  format: json
  fields:
  - name: title
    label: Section title
    type: string
  - name: subtitle
    label: Section subtitle
    type: string
    description: Optional. Leave empty to hide the subtitle.
  - name: items
    label: Conference items
    type: object
    list: true
    fields:
    - name: date
      label: Display date
      type: string
      required: false
    - name: start
      label: Sort date (YYYY-MM-DD)
      type: string
      required: true
      description: Sort date in YYYY-MM-DD format. For month-only events use the first
        day; the displayed date is controlled separately.
    - name: title
      label: Title
      type: string
      required: true
    - name: event
      label: Event
      type: string
      required: false
    - name: location
      label: Location
      type: string
      required: false
    - name: year
      label: Year
      type: number
      required: false
      hidden: true
      description: Legacy field; display and sorting use Date and Start.
- name: background
  label: Background
  type: file
  path: content/background.json
  format: json
  fields:
  - name: title
    label: Section title
    type: string
  - name: subtitle
    label: Section subtitle
    type: string
  - name: education
    label: Education
    type: object
    required: false
    list: true
    fields:
    - name: degree
      label: Degree
      type: string
      required: false
    - name: institution
      label: Institution
      type: string
      required: false
    - name: period
      label: Period
      type: string
      required: false
    - name: detail
      label: Detail
      type: string
      required: false
  - name: experience_title
    label: Experience heading
    type: string
  - name: experience
    label: Research experience
    type: object
    list: true
    fields:
    - name: role
      label: Role
      type: string
    - name: institution
      label: Institution
      type: string
    - name: period
      label: Period
      type: string
  - name: tools_title
    label: Software & languages heading
    type: string
  - name: tools
    label: Software / tools
    type: string
    list: true
  - name: languages
    label: Programming languages
    type: string
    list: true
